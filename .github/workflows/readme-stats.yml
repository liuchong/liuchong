name: Update GitHub Personal Stats

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

env:
  # Reading the profile is the whole cost: attributing a language by who wrote it
  # asks GitHub once per repository per address, which takes minutes. Drawing is
  # offline, so the profile is read once and every tile comes out of that file.
  FETCH_OPTIONS: >-
    --user ${{ github.repository_owner }}
    --authored-languages
    --author-email mail@liuchong.io,mail@liuchong.dev,mail@liuchong.cn,mail@liuchong.com,mail@liuchong.org,mail@liuchong.net,bjlclc@gmail.com,liuchong@xd.com,liuchong@xindong.com
    --min-repo-language-share 2
  SAVED_PROFILE: github-stats.json

  # Every figure is its own tile, so the README composes the two rows itself:
  # stats beside languages, then the contribution total, the heat ring, and the
  # longest streak.
  #
  # Both rows are sized to the width of the column they sit in, measured on the
  # profile page: 846px, and a code block below them fills all of it, so a row
  # any narrower reads as indented. Images on one line are separated by 3.8px of
  # inline whitespace, which the arithmetic has to leave room for: two panels
  # come to 843.8px and three figures to 844.6px, both a hair inside the column.
  # Rounding them up to fill it exactly risks a wrap, which would drop the last
  # tile onto its own line.
  #
  # The two panels are drawn at both widths. A phone README column is about
  # 308px and takes the 275px drawing at 1:1. Heights are pinned per row so each
  # row sits flush.
  # The panels' inner margin is pinned to the 16px a code block indents its text
  # by, so the rows above the chart begin on the same column as the chart itself.
  # Left to itself it scales with the width and comes to 21 at this size, which
  # reads as the chart being outdented by five pixels. The three figures below
  # centre what they hold, so their margin has nothing to line up with.
  #
  # Every tile is set in the same monospaced face the chart is, so the page reads
  # as one thing rather than as cards above a code block.
  DRAW_OPTIONS: --user ${{ github.repository_owner }} --font mono
  DESKTOP_PANEL: --width 420 --height 220 --padding 16
  PHONE_PANEL: --width 275 --height 220 --padding 16
  FIGURE: --width 279 --height 175

  # Lines rather than hours as the figure, because how much was written says more
  # about a day than how long it took; the hours ride along as a column, and the
  # authorship column says how much of each language an agent wrote.
  ACTIVITY_RECORD: activity-record
  ACTIVITY_BLOCKS: --activity-blocks lines/languages,authors=on,time=on

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Check personal stats token
        env:
          PERSONAL_STATS_TOKEN: ${{ secrets.PERSONAL_STATS_TOKEN }}
        run: test -n "$PERSONAL_STATS_TOKEN"

      - name: Read the profile once
        uses: liuchong/github-personal-stats@v1.5.1
        with:
          mode: fetch
          version: v1.5.1
          path: ${{ env.SAVED_PROFILE }}
          options: ${{ env.FETCH_OPTIONS }}
          token: ${{ secrets.PERSONAL_STATS_TOKEN }}

      # Nothing below reaches GitHub, so none of it needs the token.
      - name: Draw the light stats tile for a desktop column
        uses: liuchong/github-personal-stats@v1.5.1
        with:
          card: stats
          version: v1.5.1
          path: profile/stats-light.svg
          options: --fixture ${{ env.SAVED_PROFILE }} ${{ env.DRAW_OPTIONS }} ${{ env.DESKTOP_PANEL }} --theme light

      - name: Draw the light stats tile for a phone column
        uses: liuchong/github-personal-stats@v1.5.1
        with:
          card: stats
          version: v1.5.1
          path: profile/stats-narrow-light.svg
          options: --fixture ${{ env.SAVED_PROFILE }} ${{ env.DRAW_OPTIONS }} ${{ env.PHONE_PANEL }} --theme light

      - name: Draw the dark stats tile for a desktop column
        uses: liuchong/github-personal-stats@v1.5.1
        with:
          card: stats
          version: v1.5.1
          path: profile/stats-dark.svg
          options: --fixture ${{ env.SAVED_PROFILE }} ${{ env.DRAW_OPTIONS }} ${{ env.DESKTOP_PANEL }} --theme dark

      - name: Draw the dark stats tile for a phone column
        uses: liuchong/github-personal-stats@v1.5.1
        with:
          card: stats
          version: v1.5.1
          path: profile/stats-narrow-dark.svg
          options: --fixture ${{ env.SAVED_PROFILE }} ${{ env.DRAW_OPTIONS }} ${{ env.PHONE_PANEL }} --theme dark

      - name: Draw the light languages tile for a desktop column
        uses: liuchong/github-personal-stats@v1.5.1
        with:
          card: languages
          version: v1.5.1
          path: profile/languages-light.svg
          options: --fixture ${{ env.SAVED_PROFILE }} ${{ env.DRAW_OPTIONS }} ${{ env.DESKTOP_PANEL }} --hide-language Ruby --theme light

      - name: Draw the light languages tile for a phone column
        uses: liuchong/github-personal-stats@v1.5.1
        with:
          card: languages
          version: v1.5.1
          path: profile/languages-narrow-light.svg
          options: --fixture ${{ env.SAVED_PROFILE }} ${{ env.DRAW_OPTIONS }} ${{ env.PHONE_PANEL }} --hide-language Ruby --theme light

      - name: Draw the dark languages tile for a desktop column
        uses: liuchong/github-personal-stats@v1.5.1
        with:
          card: languages
          version: v1.5.1
          path: profile/languages-dark.svg
          options: --fixture ${{ env.SAVED_PROFILE }} ${{ env.DRAW_OPTIONS }} ${{ env.DESKTOP_PANEL }} --hide-language Ruby --theme dark

      - name: Draw the dark languages tile for a phone column
        uses: liuchong/github-personal-stats@v1.5.1
        with:
          card: languages
          version: v1.5.1
          path: profile/languages-narrow-dark.svg
          options: --fixture ${{ env.SAVED_PROFILE }} ${{ env.DRAW_OPTIONS }} ${{ env.PHONE_PANEL }} --hide-language Ruby --theme dark

      - name: Draw the light total contributions tile
        uses: liuchong/github-personal-stats@v1.5.1
        with:
          card: metric
          version: v1.5.1
          path: profile/total-light.svg
          options: --fixture ${{ env.SAVED_PROFILE }} ${{ env.DRAW_OPTIONS }} ${{ env.FIGURE }} --metric total --theme light

      - name: Draw the dark total contributions tile
        uses: liuchong/github-personal-stats@v1.5.1
        with:
          card: metric
          version: v1.5.1
          path: profile/total-dark.svg
          options: --fixture ${{ env.SAVED_PROFILE }} ${{ env.DRAW_OPTIONS }} ${{ env.FIGURE }} --metric total --theme dark

      - name: Draw the light heat ring tile
        uses: liuchong/github-personal-stats@v1.5.1
        with:
          card: heat
          version: v1.5.1
          path: profile/heat-light.svg
          options: --fixture ${{ env.SAVED_PROFILE }} ${{ env.DRAW_OPTIONS }} ${{ env.FIGURE }} --heat-threshold 123 --theme light

      - name: Draw the dark heat ring tile
        uses: liuchong/github-personal-stats@v1.5.1
        with:
          card: heat
          version: v1.5.1
          path: profile/heat-dark.svg
          options: --fixture ${{ env.SAVED_PROFILE }} ${{ env.DRAW_OPTIONS }} ${{ env.FIGURE }} --heat-threshold 123 --theme dark

      - name: Draw the light longest streak tile
        uses: liuchong/github-personal-stats@v1.5.1
        with:
          card: metric
          version: v1.5.1
          path: profile/longest-light.svg
          options: --fixture ${{ env.SAVED_PROFILE }} ${{ env.DRAW_OPTIONS }} ${{ env.FIGURE }} --metric longest --theme light

      - name: Draw the dark longest streak tile
        uses: liuchong/github-personal-stats@v1.5.1
        with:
          card: metric
          version: v1.5.1
          path: profile/longest-dark.svg
          options: --fixture ${{ env.SAVED_PROFILE }} ${{ env.DRAW_OPTIONS }} ${{ env.FIGURE }} --metric longest --theme dark

      # Hours and lines are measured on my own machines and published to a private
      # repository, which this reads with a deploy key that cannot write to it.
      # Nothing in the record names a project, a path or a host.
      - name: Read the activity record
        uses: actions/checkout@v4
        with:
          repository: liuchong/personal-stats-data
          ssh-key: ${{ secrets.STATS_DATA_KEY }}
          path: ${{ env.ACTIVITY_RECORD }}

      - name: Write the activity chart into the README
        uses: liuchong/github-personal-stats@v1.5.1
        with:
          mode: update-readme
          version: v1.5.1
          section-name: activity
          target-path: README.md
          options: --activity-record ${{ env.ACTIVITY_RECORD }}/snapshots ${{ env.ACTIVITY_BLOCKS }}

      - name: Commit tiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile README.md
          git commit -m "Update GitHub personal stats" || exit 0
          git push
