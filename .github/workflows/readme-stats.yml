name: Update GitHub Personal Stats

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

env:
  # Every figure is its own tile, so the README composes the two rows itself:
  # stats beside languages, then the contribution total, the heat ring, and the
  # longest streak. A tile stays at or under 275px because that is what lets a
  # phone show it at 1:1 instead of scaling it down, which is what made one wide
  # card unreadable there. Heights are pinned per row so each row sits flush.
  SHARED_OPTIONS: >-
    --user ${{ github.repository_owner }}
    --width 275
    --heat-threshold 123
    --authored-languages
    --author-email mail@liuchong.io,mail@liuchong.dev,mail@liuchong.cn,mail@liuchong.com,mail@liuchong.org,mail@liuchong.net,bjlclc@gmail.com,liuchong@xd.com,liuchong@xindong.com
    --hide-language Ruby
    --min-repo-language-share 2
  PANEL_HEIGHT: --height 220
  FIGURE_HEIGHT: --height 175

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Check personal stats token
        env:
          PERSONAL_STATS_TOKEN: ${{ secrets.PERSONAL_STATS_TOKEN }}
        run: test -n "$PERSONAL_STATS_TOKEN"

      - name: Generate light stats tile
        uses: liuchong/github-personal-stats@v1.3.0
        with:
          card: stats
          version: v1.3.0
          path: profile/stats-light.svg
          options: ${{ env.SHARED_OPTIONS }} ${{ env.PANEL_HEIGHT }} --theme light
          token: ${{ secrets.PERSONAL_STATS_TOKEN }}

      - name: Generate dark stats tile
        uses: liuchong/github-personal-stats@v1.3.0
        with:
          card: stats
          version: v1.3.0
          path: profile/stats-dark.svg
          options: ${{ env.SHARED_OPTIONS }} ${{ env.PANEL_HEIGHT }} --theme dark
          token: ${{ secrets.PERSONAL_STATS_TOKEN }}

      - name: Generate light languages tile
        uses: liuchong/github-personal-stats@v1.3.0
        with:
          card: languages
          version: v1.3.0
          path: profile/languages-light.svg
          options: ${{ env.SHARED_OPTIONS }} ${{ env.PANEL_HEIGHT }} --theme light
          token: ${{ secrets.PERSONAL_STATS_TOKEN }}

      - name: Generate dark languages tile
        uses: liuchong/github-personal-stats@v1.3.0
        with:
          card: languages
          version: v1.3.0
          path: profile/languages-dark.svg
          options: ${{ env.SHARED_OPTIONS }} ${{ env.PANEL_HEIGHT }} --theme dark
          token: ${{ secrets.PERSONAL_STATS_TOKEN }}

      - name: Generate light total contributions tile
        uses: liuchong/github-personal-stats@v1.3.0
        with:
          card: metric
          version: v1.3.0
          path: profile/total-light.svg
          options: ${{ env.SHARED_OPTIONS }} ${{ env.FIGURE_HEIGHT }} --metric total --theme light
          token: ${{ secrets.PERSONAL_STATS_TOKEN }}

      - name: Generate dark total contributions tile
        uses: liuchong/github-personal-stats@v1.3.0
        with:
          card: metric
          version: v1.3.0
          path: profile/total-dark.svg
          options: ${{ env.SHARED_OPTIONS }} ${{ env.FIGURE_HEIGHT }} --metric total --theme dark
          token: ${{ secrets.PERSONAL_STATS_TOKEN }}

      - name: Generate light heat ring tile
        uses: liuchong/github-personal-stats@v1.3.0
        with:
          card: heat
          version: v1.3.0
          path: profile/heat-light.svg
          options: ${{ env.SHARED_OPTIONS }} ${{ env.FIGURE_HEIGHT }} --theme light
          token: ${{ secrets.PERSONAL_STATS_TOKEN }}

      - name: Generate dark heat ring tile
        uses: liuchong/github-personal-stats@v1.3.0
        with:
          card: heat
          version: v1.3.0
          path: profile/heat-dark.svg
          options: ${{ env.SHARED_OPTIONS }} ${{ env.FIGURE_HEIGHT }} --theme dark
          token: ${{ secrets.PERSONAL_STATS_TOKEN }}

      - name: Generate light longest streak tile
        uses: liuchong/github-personal-stats@v1.3.0
        with:
          card: metric
          version: v1.3.0
          path: profile/longest-light.svg
          options: ${{ env.SHARED_OPTIONS }} ${{ env.FIGURE_HEIGHT }} --metric longest --theme light
          token: ${{ secrets.PERSONAL_STATS_TOKEN }}

      - name: Generate dark longest streak tile
        uses: liuchong/github-personal-stats@v1.3.0
        with:
          card: metric
          version: v1.3.0
          path: profile/longest-dark.svg
          options: ${{ env.SHARED_OPTIONS }} ${{ env.FIGURE_HEIGHT }} --metric longest --theme dark
          token: ${{ secrets.PERSONAL_STATS_TOKEN }}

      - name: Commit tiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile
          git commit -m "Update GitHub personal stats" || exit 0
          git push
