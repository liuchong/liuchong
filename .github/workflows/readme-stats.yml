name: Update GitHub Personal Stats

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

env:
  # Three 275px tiles fill a desktop README row and stack one per row on a
  # phone, both at 1:1, where a single wide card would be scaled down until its
  # text was unreadable. The height is pinned rather than fitted so the three
  # tiles sit flush in that row; 250 clears what the streak tile needs to put
  # its ring above its figures instead of beside them.
  SHARED_OPTIONS: >-
    --user ${{ github.repository_owner }}
    --width 275
    --height 250
    --heat-threshold 123
    --authored-languages
    --author-email mail@liuchong.io,mail@liuchong.dev,mail@liuchong.cn,mail@liuchong.com,mail@liuchong.org,mail@liuchong.net,bjlclc@gmail.com,liuchong@xd.com,liuchong@xindong.com
    --hide-language Ruby
    --min-repo-language-share 2

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Check personal stats token
        env:
          PERSONAL_STATS_TOKEN: ${{ secrets.PERSONAL_STATS_TOKEN }}
        run: test -n "$PERSONAL_STATS_TOKEN"

      - name: Generate light stats tile
        uses: liuchong/github-personal-stats@v1.3.0
        with:
          card: stats
          version: v1.3.0
          path: profile/stats-light.svg
          options: ${{ env.SHARED_OPTIONS }} --theme light
          token: ${{ secrets.PERSONAL_STATS_TOKEN }}

      - name: Generate dark stats tile
        uses: liuchong/github-personal-stats@v1.3.0
        with:
          card: stats
          version: v1.3.0
          path: profile/stats-dark.svg
          options: ${{ env.SHARED_OPTIONS }} --theme dark
          token: ${{ secrets.PERSONAL_STATS_TOKEN }}

      - name: Generate light languages tile
        uses: liuchong/github-personal-stats@v1.3.0
        with:
          card: languages
          version: v1.3.0
          path: profile/languages-light.svg
          options: ${{ env.SHARED_OPTIONS }} --theme light
          token: ${{ secrets.PERSONAL_STATS_TOKEN }}

      - name: Generate dark languages tile
        uses: liuchong/github-personal-stats@v1.3.0
        with:
          card: languages
          version: v1.3.0
          path: profile/languages-dark.svg
          options: ${{ env.SHARED_OPTIONS }} --theme dark
          token: ${{ secrets.PERSONAL_STATS_TOKEN }}

      - name: Generate light streak tile
        uses: liuchong/github-personal-stats@v1.3.0
        with:
          card: streak
          version: v1.3.0
          path: profile/streak-light.svg
          options: ${{ env.SHARED_OPTIONS }} --theme light
          token: ${{ secrets.PERSONAL_STATS_TOKEN }}

      - name: Generate dark streak tile
        uses: liuchong/github-personal-stats@v1.3.0
        with:
          card: streak
          version: v1.3.0
          path: profile/streak-dark.svg
          options: ${{ env.SHARED_OPTIONS }} --theme dark
          token: ${{ secrets.PERSONAL_STATS_TOKEN }}

      - name: Commit tiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile
          git commit -m "Update GitHub personal stats" || exit 0
          git push
